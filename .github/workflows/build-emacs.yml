name: Build custom binpkgs (emacs + harfbuzz, vlc, keepassxc)

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/build-emacs.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    container: gentoo/stage3:amd64
    env:
      MAKEOPTS: "-j$(nproc)"
      FEATURES: "binpkg-logs buildpkg"
      PKGDIR: "/var/cache/binpkgs"
    steps:
      - name: Sync gentoo repo & list profiles
        run: |
          emerge --sync
          eselect profile list
      - name: Set profile (desktop if available, else base)
        run: |
          if eselect profile list | grep -q "default/linux/amd64/23.0/desktop"; then
            eselect profile set default/linux/amd64/23.0/desktop
          elif eselect profile list | grep -q "default/linux/amd64/17.1/desktop"; then
            eselect profile set default/linux/amd64/17.1/desktop
          else
            eselect profile set default/linux/amd64/23.0
          fi
          eselect profile show
      - name: Configure USE flags
        run: |
          mkdir -p /etc/portage/package.use
          echo 'app-editors/emacs gtk xft harfbuzz' > /etc/portage/package.use/emacs
          echo 'media-video/vlc qt6' > /etc/portage/package.use/vlc
          echo 'app-admin/keepassxc yubikey' > /etc/portage/package.use/keepassxc
      - name: Show PKGDIR
        run: |
          echo "PKGDIR=$PKGDIR"
          portageq pkgdir
      - name: Build emacs (harfbuzz gtk xft)
        run: |
          emerge --buildpkg --verbose app-editors/emacs 2>&1 | tee /tmp/emacs-build.log
      - name: Build vlc
        run: |
          emerge --buildpkg --verbose media-video/vlc 2>&1 | tee /tmp/vlc-build.log
      - name: Build keepassxc
        run: |
          emerge --buildpkg --verbose app-admin/keepassxc 2>&1 | tee /tmp/keepassxc-build.log
      - name: Check built packages
        run: |
          find /var/cache/binpkgs -type f \( -name "*.tbz2" -o -name "*.xpak" \) | head -20
          ls -laR /var/cache/binpkgs/
      - name: Tar packages for transfer
        run: |
          cd /var/cache/binpkgs
          tar -czf /github/workspace/binpkgs.tar.gz . 2>/dev/null || true
          ls -la /github/workspace/binpkgs.tar.gz
      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: binpkgs-tarball
          path: /github/workspace/binpkgs.tar.gz
          retention-days: 1

  upload:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download tarball
        uses: actions/download-artifact@v4
        with:
          name: binpkgs-tarball
          path: /tmp
      - name: Extract and verify
        run: |
          mkdir -p binpkgs
          tar -xzf /tmp/binpkgs.tar.gz -C binpkgs 2>/dev/null || true
          find binpkgs -type f | head -20
          ls -laR binpkgs/
      - name: Upload final artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gentoo-binpkgs
          path: binpkgs/
          retention-days: 30