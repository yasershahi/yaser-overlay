name: Build custom binpkgs (emacs + harfbuzz, vlc, keepassxc)

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/build-emacs.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    container: gentoo/stage3:amd64
    env:
      MAKEOPTS: "-j$(nproc)"
    steps:
      - name: Sync gentoo repo (with retry)
        run: |
          for i in {1..3}; do
            emerge --sync && break
            echo "Sync failed, retry $i/3..."
            sleep 10
          done
      - name: Show available profiles
        run: |
          eselect profile list
      - name: Set profile (latest desktop available)
        run: |
          # Try to find a desktop profile, fall back to base
          if eselect profile list | grep -q "default/linux/amd64/.*/desktop$"; then
            PROFILE=$(eselect profile list | grep 'default/linux/amd64/.*/desktop$' | tail -1 | awk '{print $2}')
            echo "Selected profile: $PROFILE"
            eselect profile set "$PROFILE"
          else
            echo "No desktop profile found, using base"
            eselect profile set default/linux/amd64/23.0
          fi
          eselect profile show
      - name: Configure Portage (USE)
        run: |
          mkdir -p /etc/portage/package.use
          echo 'app-editors/emacs gtk xft' > /etc/portage/package.use/emacs
          echo 'media-video/vlc qt6' > /etc/portage/package.use/vlc
          echo 'app-admin/keepassxc yubikey' > /etc/portage/package.use/keepassxc
          echo "MAKEOPTS=\"-j$(nproc)\"" >> /etc/portage/make.conf
      - name: Show Portage config
        run: |
          echo "=== make.conf ==="
          cat /etc/portage/make.conf
          echo "=== portageq pkgdir ==="
          portageq pkgdir
      - name: Build emacs (gtk xft)
        run: |
          set -o pipefail
          emerge --verbose app-editors/emacs 2>&1 | tee /tmp/emacs-build.log
      - name: Verify emacs installed
        run: |
          qlist -I emacs
          equery list emacs
          ls -la /var/db/pkg/app-editors/emacs-*/
      - name: Create emacs binary package
        run: |
          mkdir -p /github/workspace/binpkgs
          quickpkg --include-config=y --include-unmodified-config=y -o /github/workspace/binpkgs app-editors/emacs 2>&1 | tee /tmp/emacs-quickpkg.log
      - name: Debug emacs quickpkg
        run: |
          echo "=== emacs quickpkg log ==="
          cat /tmp/emacs-quickpkg.log
          echo "=== Workspace after emacs quickpkg ==="
          find /github/workspace/binpkgs -type f
      - name: Build vlc
        run: |
          set -o pipefail
          emerge --verbose media-video/vlc 2>&1 | tee /tmp/vlc-build.log
      - name: Verify vlc installed
        run: |
          qlist -I vlc
          equery list vlc
          ls -la /var/db/pkg/media-video/vlc-*/
      - name: Create vlc binary package
        run: |
          quickpkg --include-config=y --include-unmodified-config=y -o /github/workspace/binpkgs media-video/vlc 2>&1 | tee /tmp/vlc-quickpkg.log
      - name: Debug vlc quickpkg
        run: |
          echo "=== vlc quickpkg log ==="
          cat /tmp/vlc-quickpkg.log
          echo "=== Workspace after vlc quickpkg ==="
          find /github/workspace/binpkgs -type f
      - name: Build keepassxc
        run: |
          set -o pipefail
          emerge --verbose app-admin/keepassxc 2>&1 | tee /tmp/keepassxc-build.log
      - name: Verify keepassxc installed
        run: |
          qlist -I keepassxc
          equery list keepassxc
          ls -la /var/db/pkg/app-admin/keepassxc-*/
      - name: Create keepassxc binary package
        run: |
          quickpkg --include-config=y --include-unmodified-config=y -o /github/workspace/binpkgs app-admin/keepassxc 2>&1 | tee /tmp/keepassxc-quickpkg.log
      - name: Debug keepassxc quickpkg
        run: |
          echo "=== keepassxc quickpkg log ==="
          cat /tmp/keepassxc-quickpkg.log
          echo "=== Workspace after keepassxc quickpkg ==="
          find /github/workspace/binpkgs -type f
      - name: Check binary packages (no fail)
        run: |
          echo "=== Final binary packages in workspace ==="
          find /github/workspace/binpkgs -type f | sort
          ls -laR /github/workspace/binpkgs/
          FILE_COUNT=$(find /github/workspace/binpkgs -type f | wc -l)
          echo "File count: $FILE_COUNT"
      - name: Upload all logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /tmp/*-build.log
            /tmp/*-quickpkg.log
          retention-days: 1
      - name: Tar packages for transfer
        run: |
          cd /github/workspace
          tar -czf binpkgs.tar.gz binpkgs/ 2>&1
          echo "=== Tar result ==="
          ls -la binpkgs.tar.gz
          echo "=== Tar contents ==="
          tar -tzf binpkgs.tar.gz | head -20
      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: binpkgs-tarball
          path: /github/workspace/binpkgs.tar.gz
          retention-days: 1

  upload:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download tarball
        uses: actions/download-artifact@v4
        with:
          name: binpkgs-tarball
          path: /tmp
      - name: Extract and verify
        run: |
          ls -la /tmp/
          mkdir -p binpkgs
          tar -xzf /tmp/binpkgs.tar.gz -C binpkgs 2>&1
          echo "=== Extracted files ==="
          find binpkgs -type f | head -20
          ls -laR binpkgs/
      - name: Upload final artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gentoo-binpkgs
          path: binpkgs/
          retention-days: 30