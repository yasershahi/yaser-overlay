name: Build custom binpkgs (emacs + harfbuzz, vlc, keepassxc)

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/build-emacs.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    container: gentoo/stage3:amd64
    steps:
      - name: Sync gentoo repo & set profile
        run: |
          emaint sync -a
          eselect profile set default/linux/amd64/23.0/desktop
      - name: Configure USE flags
        run: |
          mkdir -p /etc/portage/package.use
          echo 'app-editors/emacs gtk xft harfbuzz' > /etc/portage/package.use/emacs
          echo 'media-video/vlc qt6' > /etc/portage/package.use/vlc
          echo 'app-admin/keepassxc yubikey' > /etc/portage/package.use/keepassxc
      - name: Build emacs (harfbuzz gtk xft)
        run: |
          emerge --buildpkg --verbose app-editors/emacs 2>&1 | tee /tmp/emacs-build.log
      - name: Build vlc
        run: |
          emerge --buildpkg --verbose media-video/vlc 2>&1 | tee /tmp/vlc-build.log
      - name: Build keepassxc
        run: |
          emerge --buildpkg --verbose app-admin/keepassxc 2>&1 | tee /tmp/keepassxc-build.log
      - name: Check built packages
        run: ls -la /usr/portage/packages/
      - name: Upload artifacts (binary packages)
        uses: actions/upload-artifact@v4
        with:
          name: gentoo-binpkgs
          path: /usr/portage/packages/
          retention-days: 30