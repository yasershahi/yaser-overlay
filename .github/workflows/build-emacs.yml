name: Build custom binpkgs (emacs + harfbuzz, vlc, keepassxc)

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/build-emacs.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    container: gentoo/stage3:amd64
    env:
      MAKEOPTS: "-j$(nproc)"
    steps:
      - name: Sync gentoo repo (with retry)
        run: |
          for i in {1..3}; do
            emerge --sync && break
            echo "Sync failed, retry $i/3..."
            sleep 10
          done
          eselect profile list
      - name: Set profile (desktop if available, else base)
        run: |
          if eselect profile list | grep -q "default/linux/amd64/23.0/desktop"; then
            eselect profile set default/linux/amd64/23.0/desktop
          elif eselect profile list | grep -q "default/linux/amd64/17.1/desktop"; then
            eselect profile set default/linux/amd64/17.1/desktop
          else
            eselect profile set default/linux/amd64/23.0
          fi
          eselect profile show
      - name: Configure Portage (FEATURES, PKGDIR, USE)
        run: |
          mkdir -p /etc/portage/package.use
          echo 'app-editors/emacs gtk xft harfbuzz' > /etc/portage/package.use/emacs
          echo 'media-video/vlc qt6' > /etc/portage/package.use/vlc
          echo 'app-admin/keepassxc yubikey' > /etc/portage/package.use/keepassxc
          echo 'FEATURES="buildpkg binpkg-logs"' >> /etc/portage/make.conf
          echo 'PKGDIR="/var/cache/binpkgs"' >> /etc/portage/make.conf
          echo 'MAKEOPTS="-j$(nproc)"' >> /etc/portage/make.conf
      - name: Show Portage config
        run: |
          echo "=== make.conf ==="
          cat /etc/portage/make.conf
          echo "=== portageq pkgdir ==="
          portageq pkgdir
          echo "=== portageq envvar FEATURES ==="
          portageq envvar FEATURES
      - name: Build emacs (harfbuzz gtk xft)
        run: |
          emerge --buildpkg --verbose app-editors/emacs 2>&1 | tee /tmp/emacs-build.log
      - name: Build vlc
        run: |
          emerge --buildpkg --verbose media-video/vlc 2>&1 | tee /tmp/vlc-build.log
      - name: Build keepassxc
        run: |
          emerge --buildpkg --verbose app-admin/keepassxc 2>&1 | tee /tmp/keepassxc-build.log
      - name: Check built packages (detailed)
        run: |
          ACTUAL_PKGDIR=$(portageq pkgdir)
          echo "Actual PKGDIR: $ACTUAL_PKGDIR"
          echo "=== All files ==="
          find "$ACTUAL_PKGDIR" -type f | sort
          echo "=== Directory tree ==="
          ls -laR "$ACTUAL_PKGDIR"/
          FILE_COUNT=$(find "$ACTUAL_PKGDIR" -type f | wc -l)
          echo "File count: $FILE_COUNT"
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "ERROR: No binary packages created!"
            exit 1
          fi
      - name: Ensure workspace exists
        run: |
          mkdir -p /github/workspace
          ls -la /github/
      - name: Tar packages for transfer
        run: |
          ACTUAL_PKGDIR=$(portageq pkgdir)
          echo "=== Creating tar from $ACTUAL_PKGDIR ==="
          cd "$ACTUAL_PKGDIR"
          tar -czf /github/workspace/binpkgs.tar.gz . 2>&1
          echo "=== Tar result ==="
          ls -la /github/workspace/binpkgs.tar.gz
          echo "=== Tar contents ==="
          tar -tzf /github/workspace/binpkgs.tar.gz | head -20
      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: binpkgs-tarball
          path: /github/workspace/binpkgs.tar.gz
          retention-days: 1

  upload:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download tarball
        uses: actions/download-artifact@v4
        with:
          name: binpkgs-tarball
          path: /tmp
      - name: Extract and verify
        run: |
          ls -la /tmp/
          mkdir -p binpkgs
          tar -xzf /tmp/binpkgs.tar.gz -C binpkgs 2>&1
          echo "=== Extracted files ==="
          find binpkgs -type f | head -20
          ls -laR binpkgs/
      - name: Upload final artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gentoo-binpkgs
          path: binpkgs/
          retention-days: 30